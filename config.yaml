# config.yaml
data:
  min_playlist_tracks: 10
  min_track_occurrences: 5
  max_duplicate_tracks: 3

train_test_split:
  test_size: 0.2
  random_state: 42

model_training_als:
  factors: 50
  iterations: 20
  regularization: 0.01

model_training_bpr:
  factors: 50
  iterations: 20
  regularization: 0.01

evaluation:
  k: 10
  target_metric: "ranking_metrics_at_k" # calculates the ranking metrics precision, MAP, NDCG, and AUC in a single pass

optuna:
  n_trials: 50
  study_name: "playlist_recommendation_optimization"

mlflow:
  experiment_name: "playlist_recommendation"
  tracking_uri: "http://localhost:5000"

